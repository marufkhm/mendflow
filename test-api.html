<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест API Mendflow</title>
  <style>
    body{font-family:Arial,sans-serif;margin:20px}.test-section{margin:20px 0;padding:20px;border:1px solid #ddd}.result{margin-top:10px;padding:10px;background:#f5f5f5;white-space:pre-wrap}.error{background:#ffe6e6}.success{background:#e6ffe6}input,button,textarea{margin:5px;padding:8px}
  </style>
</head>
<body>
  <h1>Тест API Mendflow</h1>
  <div class="test-section"><h2>Регистрация</h2><input id="regFirstName" value="Test"><input id="regLastName" value="User"><input id="regEmail" type="email" value="test@example.com"><input id="regPassword" type="password" value="123456"><button onclick="testRegister()">Регистрация</button><div id="regResult" class="result"></div></div>
  <div class="test-section"><h2>Вход</h2><input id="loginEmail" type="email" value="test@example.com"><input id="loginPassword" type="password" value="123456"><button onclick="testLogin()">Вход</button><div id="loginResult" class="result"></div></div>
  <div class="test-section"><h2>Создание поста</h2><textarea id="postContent" rows="3">Тестовый пост</textarea><button onclick="testCreatePost()">Создать пост</button><div id="postResult" class="result"></div></div>
  <div class="test-section"><h2>Получение постов</h2><button onclick="testGetPosts()">Получить посты</button><div id="postsResult" class="result"></div></div>
  <script>
    const currentPath = window.location.pathname.replace(/\/[^\/]*$/, "");
    const API_BASE = window.location.protocol + "//" + window.location.host + currentPath + "/api";
    async function apiRequest(endpoint, options={}) {
      const config = { headers: { ...(options.body ? {"Content-Type":"application/json"} : {}), ...(options.headers || {}) }, ...options };
      const token = localStorage.getItem("test_token");
      if (token) config.headers.Authorization = `Bearer ${token}`;
      try {
        const response = await fetch(`${API_BASE}${endpoint}`, config);
        const text = await response.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
        return { ok: response.ok, data };
      } catch (error) {
        return { ok:false, data:{ error:error.message } };
      }
    }
    async function testRegister(){const r=await apiRequest("/register.php",{method:"POST",body:JSON.stringify({firstName:regFirstName.value,lastName:regLastName.value,email:regEmail.value,password:regPassword.value})});regResult.className=`result ${r.ok?"success":"error"}`;regResult.textContent=JSON.stringify(r.data,null,2);if(r.ok&&r.data.token)localStorage.setItem("test_token",r.data.token)}
    async function testLogin(){const r=await apiRequest("/login.php",{method:"POST",body:JSON.stringify({email:loginEmail.value,password:loginPassword.value})});loginResult.className=`result ${r.ok?"success":"error"}`;loginResult.textContent=JSON.stringify(r.data,null,2);if(r.ok&&r.data.token)localStorage.setItem("test_token",r.data.token)}
    async function testCreatePost(){const r=await apiRequest("/posts.php",{method:"POST",body:JSON.stringify({content:postContent.value})});postResult.className=`result ${r.ok?"success":"error"}`;postResult.textContent=JSON.stringify(r.data,null,2)}
    async function testGetPosts(){const r=await apiRequest("/posts.php");postsResult.className=`result ${r.ok?"success":"error"}`;postsResult.textContent=JSON.stringify(r.data,null,2)}
  </script>
</body>
</html>
