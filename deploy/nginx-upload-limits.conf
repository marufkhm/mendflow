# Mendflow upload limits (nginx blocks before PHP if this is missing).
# Install on server:
#   sudo cp deploy/nginx-upload-limits.conf /etc/nginx/conf.d/mendflow-upload-limits.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# App allows up to 25 MB images / 50 MB video (see api/upload.php).

client_max_body_size 64M;
