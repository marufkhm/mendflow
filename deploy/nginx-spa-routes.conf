# Mendflow SPA — public project links /p/{slug}
#
# DO NOT append this file to /etc/nginx/sites-available/mendflow with cat >> …
# A bare "location" outside server {} breaks nginx -t.
#
# On the server, run:
#   cd /var/www/html/mendflow && sudo bash deploy/fix-spa-routes.sh
#
# Or paste INSIDE server { … } (before location ~ \.php$):
#
#     # Public project pages (SEO meta + SPA)
#     location ~ ^/p/([a-zA-Z0-9_-]+)/?$ {
#         rewrite ^ /p.php?slug=$1 last;
#     }
#
# p.php injects og:title/description and serves index.html for the app.
